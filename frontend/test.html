<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Customer Management</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #f0f0f0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Customer Management - JavaScript Test</h1>

    <div class="test-section">
        <h2>Test 1: Check if JavaScript loads</h2>
        <button onclick="testJavaScript()">Click Me - Test JavaScript</button>
        <div id="jsTest"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Check Backend Connection</h2>
        <button onclick="testBackend()">Test Backend API</button>
        <div id="backendTest"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Test Add Customer Form</h2>
        <form id="testForm" onsubmit="testAddCustomer(event)">
            <input type="text" name="first_name" placeholder="First Name" required><br><br>
            <input type="text" name="last_name" placeholder="Last Name" required><br><br>
            <input type="email" name="email" placeholder="Email" required><br><br>
            <button type="submit">Submit Test Customer</button>
        </form>
        <div id="formTest"></div>
    </div>

    <div id="result"></div>

    <script>
        // Test 1: JavaScript works
        function testJavaScript() {
            document.getElementById('jsTest').innerHTML = '<span class="success">✓ JavaScript is working!</span>';
        }

        // Test 2: Backend connection
        async function testBackend() {
            const resultDiv = document.getElementById('backendTest');
            resultDiv.innerHTML = 'Testing...';

            try {
                const response = await fetch('/health');
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = '<span class="success">✓ Backend is running!</span><br>' + JSON.stringify(data);
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ Backend responded but not healthy</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">✗ Cannot connect to backend: ' + error.message + '</span>';
            }
        }

        // Test 3: Form submission
        async function testAddCustomer(event) {
            event.preventDefault();

            const resultDiv = document.getElementById('formTest');
            resultDiv.innerHTML = 'Submitting...';

            const formData = new FormData(event.target);
            const customerData = {};

            for (let [key, value] of formData.entries()) {
                customerData[key] = value;
            }

            console.log('Sending data:', customerData);

            try {
                const response = await fetch('/api/customers/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(customerData)
                });

                const data = await response.json();

                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.innerHTML = '<span class="success">✓ Customer added successfully!</span><br>' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ Failed: ' + data.message + '</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<span class="error">✗ Error: ' + error.message + '</span>';
            }
        }

        // Auto-run tests on page load
        window.addEventListener('load', function() {
            console.log('Page loaded - check console for errors');
        });
    </script>
</body>
</html>
